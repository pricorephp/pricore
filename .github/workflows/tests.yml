name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    name: tests (${{ matrix.database }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql, pgsql]

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: pricore
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pricore
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Build Assets
        run: npm run build

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      # phpunit.xml pins sqlite; these env vars override it for the other engines so
      # the suite actually exercises the databases self-hosters run in production.
      - name: Configure database connection
        run: |
          case "${{ matrix.database }}" in
            mysql)
              {
                echo "DB_CONNECTION=mysql"
                echo "DB_HOST=127.0.0.1"
                echo "DB_PORT=3306"
                echo "DB_DATABASE=pricore"
                echo "DB_USERNAME=root"
                echo "DB_PASSWORD=password"
              } >> "$GITHUB_ENV"
              ;;
            pgsql)
              {
                echo "DB_CONNECTION=pgsql"
                echo "DB_HOST=127.0.0.1"
                echo "DB_PORT=5432"
                echo "DB_DATABASE=pricore"
                echo "DB_USERNAME=postgres"
                echo "DB_PASSWORD=password"
              } >> "$GITHUB_ENV"
              ;;
          esac

      - name: Tests
        run: ./vendor/bin/pest
